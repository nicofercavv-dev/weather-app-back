spring:
  application:
    name: climatempo
  datasource:
    url: jdbc:postgresql://localhost:5432/climatempo_db
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    baseline-on-migrate: true

spring-doc:
  api_docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
