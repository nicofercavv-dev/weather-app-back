spring:
  application:
    name: climatempo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meteorologia_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    baseline-on-migrate: true

spring-doc:
  api_docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}